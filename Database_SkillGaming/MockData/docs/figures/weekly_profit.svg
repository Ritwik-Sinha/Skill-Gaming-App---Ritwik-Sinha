  <g id="text_39">
   <text style="fill: #516176; font: 9.5px 'DejaVu Sans'" transform="translate(25.611875 563.607492)">Player tiers, cash, liabilities and prior-week contribution carry forward. Each reward announcement precedes that week’s outcomes.</text>
   <text style="fill: #516176; font: 9.5px 'DejaVu Sans'" transform="translate(25.611875 576.771895)">W7 has no entrants or earned prizes but still incurs fixed costs. W8 recovers while new reward publication is blocked by the prior quiet week.</text>
   <text style="fill: #516176; font: 9.5px 'DejaVu Sans'" transform="translate(25.611875 589.936297)">Synthetic funded-product projection • cumulative profit adds actual weekly model results, not independent scenario forecasts or cash injections.</text>
  </g>
 </g>
