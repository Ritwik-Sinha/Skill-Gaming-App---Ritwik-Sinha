  <g id="text_33">
   <text style="fill: #243247; font: 700 18px 'DejaVu Sans'; text-anchor: start" x="32.731875" y="26.637187" transform="rotate(-0 32.731875 26.637187)">New equity funds the campaign; it does not create profit</text>
  </g>
  <g id="text_34">
   <text style="fill: #516176; font: 11px 'DejaVu Sans'; text-anchor: start" x="32.731875" y="45.006281" transform="rotate(-0 32.731875 45.006281)">Low-cash scenario • existing player obligations and reserves stay protected before new rewards</text>
  </g>
  <g id="text_35">
   <text style="fill: #516176; font: 9.5px 'DejaVu Sans'" transform="translate(32.731875 455.895492)">The protected amount includes existing wallets, separate withdrawal/unsettled liabilities, current prizes and operating/risk buffers.</text>
   <text style="fill: #516176; font: 9.5px 'DejaVu Sans'" transform="translate(32.731875 469.059895)">The small $124 balances are labeled explicitly; bar heights remain proportional. Company equity must be cleared first.</text>
   <text style="fill: #516176; font: 9.5px 'DejaVu Sans'" transform="translate(32.731875 482.224297)">Neither new equity nor player deposits count as platform profit. Reserving a new pool does not cancel or spend existing obligations.</text>
  </g>
