  <g id="text_33">
   <text style="fill: #243247; font: 700 18px 'DejaVu Sans'; text-anchor: start" x="20.898781" y="26.637187" transform="rotate(-0 20.898781 26.637187)">The retention offer can absorb a limited weekly loss</text>
  </g>
  <g id="text_34">
   <text style="fill: #516176; font: 11px 'DejaVu Sans'; text-anchor: start" x="20.898781" y="51.774281" transform="rotate(-0 20.898781 51.774281)">$10,000 fixed campaign pool • reduce contribution after costs, not games or wagers</text>
  </g>
  <g id="text_35">
   <text style="fill: #516176; font: 9.5px 'DejaVu Sans'" transform="translate(20.898781 590.535492)">Contribution already deducts modeled costs and deferred fees. These percentages do not imply equal changes in attempts, stakes or retention.</text>
   <text style="fill: #516176; font: 9.5px 'DejaVu Sans'" transform="translate(20.898781 603.699895)">Cumulative profit = current modeled $5,327.50 + campaign-week profit; each branch starts at zero.</text>
   <text style="fill: #516176; font: 9.5px 'DejaVu Sans'" transform="translate(20.898781 616.864297)">Hatching marks the branch outside the weekly loss allowance, even though its two-week cumulative profit remains positive. Equity is excluded.</text>
  </g>
