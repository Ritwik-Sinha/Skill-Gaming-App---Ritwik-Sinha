  <g id="text_38">
   <text style="fill: #516176; font: 9.5px 'DejaVu Sans'" transform="translate(37.027812 469.059895)">Crowns shown below each tier are minimum weekly prize-eligibility thresholds, not promotion thresholds or a purchase requirement.</text>
   <text style="fill: #516176; font: 9.5px 'DejaVu Sans'" transform="translate(37.027812 482.224297)">A pool is shared among eligible prize ranks; it is not a guaranteed amount per player. Both schedules apply only to new periods.</text>
